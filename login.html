<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpookyVerse Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#050505,#111,#1a0000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.login-box{
    width:360px;
    background:#111;
    border:1px solid #2b2b2b;
    border-radius:14px;
    padding:35px;
    box-shadow:0 0 30px rgba(255,0,0,.15);
}

.logo{
    text-align:center;
    font-size:30px;
    color:#ff2a2a;
    margin-bottom:8px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:8px;
    color:white;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#ff2a2a;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#c40000;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff2a2a;
}

.error{
    color:#ff6666;
    text-align:center;
    margin-top:15px;
    display:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">👻 SpookyVerse</div>
    <div class="subtitle">Admin Panel</div>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>

    <button onclick="login()">Login</button>

    <div id="error" class="error">
        Invalid username or password.
    </div>

</div>

<script>
function login(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();

    if(username==="admin" && password==="spookyverse"){

        localStorage.setItem("spookyAdmin","true");
        window.location.href="dashboard.html";

    }else{

        document.getElementById("error").style.display="block";

    }
}
</script>

</body>
</html
